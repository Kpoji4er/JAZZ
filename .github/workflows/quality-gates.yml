name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  process-contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate change specifications (advisory)
        id: specifications
        continue-on-error: true
        shell: pwsh
        run: .agents/skills/specify-jazz-change/scripts/test-change-spec.ps1 -Path docs/specs -Phase All

      - name: Report specification findings
        if: steps.specifications.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Output "::warning::Specification validation reported unresolved findings; this check is advisory."
          "Specification validation reported unresolved findings. See the advisory step log; other quality checks remain required." >> $env:GITHUB_STEP_SUMMARY

      - name: Validate documentation and skills
        shell: pwsh
        run: .agents/skills/document-jazz-systems/scripts/check-system-docs.ps1

      - name: Validate core generated-data graph
        shell: pwsh
        run: .agents/skills/sync-jazz-generated-data/scripts/check-generated-sync.ps1 -Package jazz

      - name: Reject unfinished Lua short strings
        shell: pwsh
        run: scripts/check-lua-quoted-strings.ps1

      - name: Reject dual Lua method wraps (stack-overflow cycles)
        shell: pwsh
        run: python docs/tools/_check_lua_wrap_cycles.py

      - name: Check whitespace in changed lines
        shell: pwsh
        run: |
          if ($env:GITHUB_BASE_REF) {
            git fetch origin $env:GITHUB_BASE_REF --depth=1
            git diff --check "origin/$env:GITHUB_BASE_REF...HEAD"
          } elseif (git rev-parse --verify HEAD^ 2>$null) {
            git diff --check HEAD^ HEAD
          } else {
            git diff --check --cached
          }
