name: Publish GitHub Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/showcase/**'
      - 'docs/wiki/weapons/**'
      - 'docs/technical/weapons/data/**'
      - 'scripts/docs/publish-github-wiki.ps1'
      - 'scripts/docs/weapons-docs.mjs'
      - '.github/workflows/publish-github-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-github-wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build and publish wiki from docs/showcase
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/docs/publish-github-wiki.ps1 -Publish -RepoSlug ${{ github.repository }}
