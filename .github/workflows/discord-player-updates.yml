name: Discord player updates

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      before_sha:
        description: Optional base commit SHA; defaults to the parent of after_sha
        required: false
        type: string
      after_sha:
        description: Optional target commit SHA; defaults to the selected workflow ref
        required: false
        type: string
      dry_run:
        description: Build and log the sanitized payload without sending it to Discord
        required: true
        default: true
        type: boolean
      force_publish:
        description: Test the same behavior as the [discord] commit marker
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: Build player update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_MENTION_UPDATE_ROLE: ${{ vars.DISCORD_MENTION_UPDATE_ROLE }}
      DISCORD_UPDATE_ROLE_ID: ${{ vars.DISCORD_UPDATE_ROLE_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      EXPECTED_BRANCH: main
      MANUAL_AFTER_SHA: ${{ inputs.after_sha }}
      MANUAL_BEFORE_SHA: ${{ inputs.before_sha }}
      MANUAL_FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish && 'true' || 'false' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}

    steps:
      - name: Check out the complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate and publish the player update
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts openai@6.49.0
          node .github/scripts/discord-player-update.mjs
