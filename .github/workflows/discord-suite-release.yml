name: Discord suite download links
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published suite tag to announce
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: discord-suite-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release view "$RELEASE_TAG" --json name,tagName,url,isDraft,isPrerelease,assets > release.json
      - name: Post download links
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node .github/scripts/discord-suite-release.mjs release.json
